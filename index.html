<!DOCTYPE html>
<html lang="pt-PT" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Produção Industrial</title>
    <!-- Tailwind CSS with Config for Dark Mode -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {}
            }
        }
    </script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Firebase SDK v8 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .mono { font-family: 'JetBrains Mono', monospace; }
        
        /* Transição fluída na barra de progresso e cor */
        .progress-transition {
            transition: width 1s cubic-bezier(0.22, 1, 0.36, 1), background-color 1s ease-in-out;
        }
        
        /* Animação de Entrada Flutuante */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-up { 
            animation: fadeUp 0.6s ease-out both; 
        }

        /* Feedback visual (Flash) ao atualizar dados - Herda as cores do tema escuro/claro automaticamente */
        .flash-update {
            animation: flashHighlight 0.6s ease-out;
        }
        @keyframes flashHighlight {
            0%, 100% { border-color: transparent; box-shadow: none; }
            50% { border-color: #22c55e; box-shadow: 0 0 15px rgba(34,197,94,0.4); }
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col p-4 md:p-6 bg-slate-50 dark:bg-[#0d1117] text-slate-900 dark:text-[#e2e8f0] transition-colors duration-300">

    <!-- HEADER (flex-none preserva a altura exata do cabeçalho) -->
    <header class="flex-none flex flex-col md:flex-row justify-between items-start md:items-center gap-6 mb-6">
        <div class="flex items-center gap-4">
            <div class="w-12 h-12 bg-emerald-100 dark:bg-emerald-500/10 rounded-xl flex items-center justify-center border border-emerald-200 dark:border-emerald-500/20">
                <i data-lucide="activity" class="text-emerald-600 dark:text-emerald-500" aria-hidden="true"></i>
            </div>
            <div>
                <h1 class="text-xl font-extrabold tracking-tight leading-none uppercase">Gestão à Vista</h1>
                <p class="text-slate-500 dark:text-[#94a3b8] text-xs mt-1 uppercase tracking-widest font-semibold">Monitorização Industrial</p>
            </div>
        </div>

        <div class="flex items-center gap-4">
            <!-- Eficiência Global (OEE) - AUMENTADA -->
            <div class="hidden md:flex flex-col items-end pr-6 border-r border-slate-300 dark:border-[#30363d]">
                <span class="text-[10px] uppercase tracking-widest text-slate-500 dark:text-[#94a3b8] font-bold">
                    <span class="sr-only">Valor do </span>OEE Global
                </span>
                <span id="global-oee" class="text-6xl xl:text-[80px] font-extrabold text-blue-600 dark:text-blue-400 mono leading-none mt-1">--%</span>
            </div>

            <!-- Relógio e Data -->
            <div class="bg-white dark:bg-[#161b22] px-4 py-2 rounded-xl border border-slate-200 dark:border-[#30363d] flex items-center gap-3">
                <i data-lucide="clock" class="text-slate-500 dark:text-[#94a3b8] w-4 h-4" aria-hidden="true"></i>
                <div class="flex flex-col items-end">
                    <span id="current-time" class="mono font-bold text-sm leading-none">--:--:--</span>
                    <span id="current-date" class="text-[10px] text-slate-500 dark:text-[#94a3b8] font-semibold leading-none mt-1">--/--/----</span>
                </div>
            </div>

            <!-- Botões de Ação -->
            <div class="flex items-center gap-2">
                <!-- Toggle Dark/Light Mode -->
                <button id="btn-theme" class="p-2.5 bg-white dark:bg-[#161b22] border border-slate-200 dark:border-[#30363d] rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors" aria-label="Alternar Tema Claro e Escuro">
                    <i data-lucide="sun" class="text-slate-500 dark:text-[#94a3b8] w-4 h-4 hidden dark:block" aria-hidden="true"></i>
                    <i data-lucide="moon" class="text-slate-500 dark:text-[#94a3b8] w-4 h-4 block dark:hidden" aria-hidden="true"></i>
                </button>
                <!-- Fullscreen -->
                <button id="btn-fullscreen" class="p-2.5 bg-white dark:bg-[#161b22] border border-slate-200 dark:border-[#30363d] rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors" aria-label="Alternar Ecrã Inteiro">
                    <i data-lucide="maximize" class="text-slate-500 dark:text-[#94a3b8] w-4 h-4" aria-hidden="true"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT (flex-1 min-h-0 garante que absorve a altura restante sem scrollar o ecrã) -->
    <main class="flex-1 min-h-0 grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <!-- CONTAINER DE LINHAS (grid-rows-2 empurra as linhas para preencher a altura 50/50) -->
        <div id="lines-container" class="lg:col-span-8 grid grid-cols-1 md:grid-cols-2 grid-rows-2 gap-4 h-full">
            <!-- SKELETON LOADERS INICIAIS -->
            <div id="loading-skeletons" class="contents">
                <div class="flex flex-col bg-white dark:bg-[#161b22] border border-slate-200 dark:border-[#30363d] rounded-2xl overflow-hidden animate-pulse h-full">
                    <div class="p-5 flex-1 flex flex-col justify-center">
                        <div class="flex items-center gap-3 mb-6">
                            <div class="w-10 h-10 bg-slate-200 dark:bg-slate-800 rounded-lg"></div>
                            <div class="space-y-2 flex-1"><div class="h-4 bg-slate-200 dark:bg-slate-800 rounded w-1/3"></div></div>
                        </div>
                        <div class="space-y-3"><div class="h-[60px] bg-slate-200 dark:bg-slate-800 rounded w-full"></div><div class="h-2 bg-slate-200 dark:bg-slate-800 rounded w-5/6"></div></div>
                    </div>
                    <div class="grid grid-cols-2 gap-4 p-5 bg-slate-100 dark:bg-[#0d1117] mt-auto">
                        <div class="h-[60px] bg-slate-200 dark:bg-slate-800 rounded"></div><div class="h-[60px] bg-slate-200 dark:bg-slate-800 rounded"></div>
                    </div>
                </div>
                <div class="flex flex-col bg-white dark:bg-[#161b22] border border-slate-200 dark:border-[#30363d] rounded-2xl overflow-hidden animate-pulse h-full">
                    <div class="p-5 flex-1 flex flex-col justify-center">
                        <div class="flex items-center gap-3 mb-6">
                            <div class="w-10 h-10 bg-slate-200 dark:bg-slate-800 rounded-lg"></div>
                            <div class="space-y-2 flex-1"><div class="h-4 bg-slate-200 dark:bg-slate-800 rounded w-1/3"></div></div>
                        </div>
                        <div class="space-y-3"><div class="h-[60px] bg-slate-200 dark:bg-slate-800 rounded w-full"></div><div class="h-2 bg-slate-200 dark:bg-slate-800 rounded w-5/6"></div></div>
                    </div>
                    <div class="grid grid-cols-2 gap-4 p-5 bg-slate-100 dark:bg-[#0d1117] mt-auto">
                        <div class="h-[60px] bg-slate-200 dark:bg-slate-800 rounded"></div><div class="h-[60px] bg-slate-200 dark:bg-slate-800 rounded"></div>
                    </div>
                </div>
            </div>
            <!-- Cards reais serão injetados aqui -->
        </div>

        <!-- PAINÉIS LATERAIS -->
        <div class="lg:col-span-4 flex flex-col gap-6 h-full min-h-0">
            <!-- EFICIÊNCIA POR SETOR -->
            <div class="flex-none bg-white dark:bg-[#161b22] border border-slate-200 dark:border-[#30363d] rounded-2xl overflow-hidden flex flex-col">
                <div class="px-5 py-4 border-b border-slate-100 dark:border-[#30363d] flex items-center gap-3 bg-slate-50 dark:bg-transparent">
                    <i data-lucide="pie-chart" class="text-blue-500 dark:text-blue-400 w-5 h-5" aria-hidden="true"></i>
                    <h2 class="text-sm font-bold uppercase tracking-tight">Eficiência por Setor</h2>
                </div>
                <!-- Mudado para <ul> -->
                <ul id="sectors-container" class="p-6 flex flex-col gap-6">
                    <!-- Skeletons Lateral -->
                    <li class="animate-pulse space-y-4">
                        <div><div class="flex justify-between mb-2"><div class="h-3 bg-slate-200 dark:bg-slate-800 rounded w-1/4"></div><div class="h-3 bg-slate-200 dark:bg-slate-800 rounded w-1/6"></div></div><div class="h-3 bg-slate-200 dark:bg-slate-800 rounded-full w-full"></div></div>
                        <div><div class="flex justify-between mb-2"><div class="h-3 bg-slate-200 dark:bg-slate-800 rounded w-1/3"></div><div class="h-3 bg-slate-200 dark:bg-slate-800 rounded w-1/6"></div></div><div class="h-3 bg-slate-200 dark:bg-slate-800 rounded-full w-full"></div></div>
                        <div><div class="flex justify-between mb-2"><div class="h-3 bg-slate-200 dark:bg-slate-800 rounded w-1/4"></div><div class="h-3 bg-slate-200 dark:bg-slate-800 rounded w-1/6"></div></div><div class="h-3 bg-slate-200 dark:bg-slate-800 rounded-full w-full"></div></div>
                    </li>
                </ul>
            </div>

            <!-- RANKING PERFORMANCE -->
            <div class="flex-1 min-h-0 bg-white dark:bg-[#161b22] border border-slate-200 dark:border-[#30363d] rounded-2xl flex flex-col overflow-hidden">
                <div class="px-5 py-4 border-b border-slate-100 dark:border-[#30363d] flex items-center justify-between bg-slate-50 dark:bg-transparent">
                    <div class="flex items-center gap-3">
                        <i data-lucide="trophy" class="text-amber-500 dark:text-amber-400 w-5 h-5" aria-hidden="true"></i>
                        <h2 class="text-sm font-bold uppercase tracking-tight">Ranking Performance</h2>
                    </div>
                    <span class="text-[9px] bg-slate-200 dark:bg-[#30363d] text-slate-700 dark:text-[#94a3b8] px-3 py-1 rounded uppercase font-bold tracking-widest cursor-help" title="Acumulado consolidado até o dia anterior (D-1)">PONTOS (D-1)</span>
                </div>
                <!-- Mudado para <ul>, usa flex-1 e overflow auto caso as linhas aumentem -->
                <ul id="ranking-container" class="p-2 text-sm flex-1 overflow-y-auto">
                    <!-- Skeletons Ranking -->
                    <li class="p-4 animate-pulse flex justify-between items-center">
                        <div class="flex items-center gap-4"><div class="w-6 h-6 bg-slate-200 dark:bg-slate-800 rounded-md"></div><div class="h-4 bg-slate-200 dark:bg-slate-800 rounded w-16"></div></div>
                        <div class="h-4 bg-slate-200 dark:bg-slate-800 rounded w-12"></div>
                    </li>
                </ul>
            </div>
        </div>
    </main>

    <!-- FOOTER (flex-none) -->
    <footer class="flex-none mt-6 bg-amber-50 dark:bg-amber-500/5 border border-amber-200 dark:border-amber-500/10 rounded-xl p-3 overflow-hidden whitespace-nowrap">
        <div class="flex items-center gap-4 animate-pulse">
            <i data-lucide="alert-triangle" class="text-amber-500 w-5 h-5 flex-shrink-0" aria-hidden="true"></i>
            <p id="alert-marquee" class="text-amber-700 dark:text-amber-200/80 text-sm font-bold uppercase tracking-wider" aria-live="polite">
                Conectando ao banco de dados industrial...
            </p>
        </div>
    </footer>

    <script>
        (function() {
            // Theme Toggle Logic
            const btnTheme = document.getElementById('btn-theme');
            btnTheme.addEventListener('click', () => {
                document.documentElement.classList.toggle('dark');
            });

            // Mapeamento visual das linhas
            const lineMeta = {
                "LA": { color: "#22c55e" },
                "L1": { color: "#3b82f6" }, // Azul mais forte para ler bem no modo claro
                "L2": { color: "#f59e0b" },
                "L3": { color: "#ef4444" }
            };

            const FIXED_LINES = ['LA', 'L1', 'L2', 'L3'];
            const FIXED_SECTORS = [
                { key: 'automotivo', label: 'Automotivo' },
                { key: 'descartaveis', label: 'Descartáveis' },
                { key: 'cirurgico', label: 'Cirúrgico' }
            ];

            let currentState = {};
            FIXED_LINES.forEach(line => {
                currentState[line] = {
                    lineId: line,
                    setor: "Aguardando...",
                    eficiencia: 0, meta: 0, realizado: 0, hc_prog: 0, rejeito: 0, pontos: 0
                };
            });

            const numberFormatter = new Intl.NumberFormat('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
            const intFormatter = new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 0 });

            let flattenedData = [];
            let previousDataMap = new Map();

            // Fullscreen Logic
            const btnFullscreen = document.getElementById('btn-fullscreen');
            btnFullscreen.addEventListener('click', () => {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(err => console.log(err));
                    btnFullscreen.innerHTML = `
                        <i data-lucide="minimize" class="text-slate-500 dark:text-[#94a3b8] w-4 h-4" aria-hidden="true"></i>
                    `;
                } else {
                    document.exitFullscreen();
                    btnFullscreen.innerHTML = `
                        <i data-lucide="maximize" class="text-slate-500 dark:text-[#94a3b8] w-4 h-4" aria-hidden="true"></i>
                    `;
                }
                if (window.lucide) lucide.createIcons();
            });

            function getStatusInfo(eficiencia) {
                if (eficiencia <= 0) return { label: "PARADA", cls: "bg-red-100 text-red-700 dark:bg-red-500/10 dark:text-red-500" };
                if (eficiencia < 85) return { label: "ATENÇÃO", cls: "bg-amber-100 text-amber-700 dark:bg-amber-500/10 dark:text-amber-500" };
                return { label: "EM PRODUÇÃO", cls: "bg-emerald-100 text-emerald-700 dark:bg-emerald-500/10 dark:text-emerald-500" };
            }

            function getBarColor(eficiencia, defaultColor) {
                if (eficiencia < 50) return '#ef4444'; 
                if (eficiencia < 85) return '#f59e0b'; 
                return defaultColor; 
            }

            function getTrendSvg(isUp) {
                if(isUp) {
                    return `<svg class="w-5 h-5 xl:w-8 xl:h-8 text-emerald-500" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"></polyline><polyline points="16 7 22 7 22 13"></polyline></svg><span class="sr-only">Subida ou Mantida</span>`;
                } else {
                    return `<svg class="w-5 h-5 xl:w-8 xl:h-8 text-red-500" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="22 17 13.5 8.5 8.5 13.5 2 7"></polyline><polyline points="16 17 22 17 22 11"></polyline></svg><span class="sr-only">Descida</span>`;
                }
            }

            const normalizeSector = (str) => {
                if (!str) return 'outros';
                const s = str.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
                if (s.includes('auto')) return 'automotivo';
                if (s.includes('descart')) return 'descartaveis';
                if (s.includes('cirurg')) return 'cirurgico';
                return 'outros';
            };

            function renderDashboard() {
                const container = document.getElementById('lines-container');
                const rankingContainer = document.getElementById('ranking-container');
                const sectorContainer = document.getElementById('sectors-container');

                if (!container || !rankingContainer || !sectorContainer) return;

                const skel = document.getElementById('loading-skeletons');
                if (skel) skel.remove();

                let totalEficienciaAtivas = 0;
                let activeLinesCount = 0;

                flattenedData.forEach((item, index) => {
                    const ef = Number(item.eficiencia) || 0;
                    const hc = Math.round(Number(item.hc_prog) || 0);
                    const meta = Number(item.meta) || 0;
                    const real = Number(item.realizado) || 0;
                    const rej = Number(item.rejeito) || 0;
                    
                    if (meta > 0 || hc > 0 || ef > 0) {
                        totalEficienciaAtivas += ef;
                        activeLinesCount++;
                    }

                    const status = getStatusInfo(ef);
                    const defaultColor = lineMeta[item.lineId]?.color || "#94a3b8";
                    const barColor = getBarColor(ef, defaultColor);

                    const prevItem = previousDataMap.get(item.lineId);
                    const prevEf = prevItem ? (Number(prevItem.eficiencia) || 0) : ef;
                    const trendUp = ef >= prevEf;

                    let card = document.getElementById(`card-${item.lineId}`);

                    if (!card) {
                        // Cartão preenche altura (h-full), com interior bg-white/dark e separador de fundo claro na métrica
                        const cardHTML = `
                            <div id="card-${item.lineId}" class="flex flex-col h-full bg-white dark:bg-[#161b22] border border-slate-200 dark:border-[#30363d] rounded-2xl overflow-hidden transition-all hover:border-blue-500/30 dark:hover:border-blue-500/30 animate-fade-up" style="animation-delay: ${index * 0.1}s">
                                
                                <div class="px-5 py-4 border-b border-slate-100 dark:border-[#30363d] flex justify-between items-center flex-none">
                                    <div class="flex items-center gap-3">
                                        <div class="w-10 h-10 rounded-lg flex items-center justify-center font-bold text-lg text-white dark:text-[#0d1117]" style="background-color: ${defaultColor}">
                                            ${item.lineId}
                                        </div>
                                        <div>
                                            <h2 id="sector-title-${item.lineId}" class="text-sm font-bold uppercase tracking-tight text-slate-800 dark:text-white">${item.setor}</h2>
                                            <div class="flex items-center gap-1.5 text-slate-500 dark:text-[#94a3b8] text-[10px] mt-0.5 uppercase font-bold">
                                                <span>${item.lineId}</span>
                                            </div>
                                        </div>
                                    </div>
                                    <span id="status-${item.lineId}" class="text-[9px] font-bold px-2.5 py-1 rounded-full uppercase tracking-widest ${status.cls}">
                                        ${status.label}
                                    </span>
                                </div>
                                
                                <div class="px-5 py-4 flex-1 flex flex-col justify-center">
                                    <div class="flex justify-between items-end mb-2">
                                        <span class="text-xs xl:text-sm uppercase tracking-widest text-slate-500 dark:text-[#94a3b8] font-bold">Eficiência Acumulada</span>
                                        <span id="ef-val-${item.lineId}" class="text-4xl xl:text-[60px] font-mono font-bold text-slate-800 dark:text-white leading-none">${numberFormatter.format(ef)}%</span>
                                    </div>
                                    <div class="h-2 bg-slate-100 dark:bg-[#0d1117] rounded-full overflow-hidden mt-2" role="progressbar" aria-valuenow="${Math.min(ef, 100)}" aria-valuemin="0" aria-valuemax="100">
                                        <div id="ef-bar-${item.lineId}" class="h-full progress-transition" style="width: ${Math.min(ef, 100)}%; background-color: ${barColor}"></div>
                                    </div>
                                </div>

                                <!-- SEPARAÇÃO VISUAL: Fundo alterado e empurrado para o fim do cartao -->
                                <div class="grid grid-cols-2 gap-4 p-4 lg:p-5 bg-slate-50 dark:bg-[#0d1117] border-t border-slate-100 dark:border-[#30363d] mt-auto flex-none">
                                    <div class="flex items-center gap-2.5">
                                        <i data-lucide="target" class="text-slate-400 dark:text-[#94a3b8] w-5 h-5 xl:w-8 xl:h-8" aria-hidden="true"></i>
                                        <div>
                                            <span class="block text-xs xl:text-sm uppercase tracking-widest text-slate-500 dark:text-[#94a3b8] font-bold mb-1">Meta</span>
                                            <span id="meta-${item.lineId}" class="text-4xl xl:text-[60px] font-bold font-mono leading-none text-slate-800 dark:text-white">${intFormatter.format(meta)}</span>
                                        </div>
                                    </div>
                                    <div class="flex items-center gap-2.5">
                                        <div id="trend-icon-${item.lineId}">
                                            ${getTrendSvg(trendUp)}
                                        </div>
                                        <div>
                                            <span class="block text-xs xl:text-sm uppercase tracking-widest text-slate-500 dark:text-[#94a3b8] font-bold mb-1">Real</span>
                                            <span id="real-${item.lineId}" class="text-4xl xl:text-[60px] font-bold font-mono leading-none ${trendUp ? 'text-emerald-600 dark:text-emerald-500' : 'text-red-600 dark:text-red-500'}">${intFormatter.format(real)}</span>
                                        </div>
                                    </div>
                                    <div class="flex items-center gap-2.5">
                                        <i data-lucide="users" class="text-slate-400 dark:text-[#94a3b8] w-5 h-5 xl:w-8 xl:h-8" aria-hidden="true"></i>
                                        <div>
                                            <span class="block text-xs xl:text-sm uppercase tracking-widest text-slate-500 dark:text-[#94a3b8] font-bold mb-1" aria-label="Headcount (Funcionários)">HC</span>
                                            <span id="hc-${item.lineId}" class="text-4xl xl:text-[60px] font-bold font-mono leading-none text-slate-800 dark:text-white">${intFormatter.format(hc)}</span>
                                        </div>
                                    </div>
                                    <div class="flex items-center gap-2.5">
                                        <i data-lucide="alert-circle" class="text-slate-400 dark:text-[#94a3b8] w-5 h-5 xl:w-8 xl:h-8" aria-hidden="true"></i>
                                        <div>
                                            <span class="block text-xs xl:text-sm uppercase tracking-widest text-slate-500 dark:text-[#94a3b8] font-bold mb-1">Rejeito</span>
                                            <span id="rej-${item.lineId}" class="text-4xl xl:text-[60px] font-bold font-mono leading-none text-slate-800 dark:text-white">${numberFormatter.format(rej)}%</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `;
                        container.insertAdjacentHTML('beforeend', cardHTML);
                        lucide.createIcons({ root: document.getElementById(`card-${item.lineId}`) });
                    } 
                    else {
                        let hasChanges = false;

                        const updateText = (id, newText) => {
                            const el = document.getElementById(id);
                            if(el && el.textContent !== newText) {
                                el.textContent = newText;
                                hasChanges = true;
                            }
                        };

                        updateText(`sector-title-${item.lineId}`, item.setor); 
                        updateText(`ef-val-${item.lineId}`, `${numberFormatter.format(ef)}%`);
                        updateText(`meta-${item.lineId}`, intFormatter.format(meta));
                        updateText(`real-${item.lineId}`, intFormatter.format(real));
                        updateText(`hc-${item.lineId}`, intFormatter.format(hc));
                        updateText(`rej-${item.lineId}`, `${numberFormatter.format(rej)}%`);

                        const bar = document.getElementById(`ef-bar-${item.lineId}`);
                        if (bar) {
                            if (bar.style.width !== `${Math.min(ef, 100)}%`) {
                                bar.style.width = `${Math.min(ef, 100)}%`;
                                hasChanges = true;
                                bar.parentElement.setAttribute('aria-valuenow', Math.min(ef, 100));
                            }
                            if (bar.style.backgroundColor !== barColor) {
                                bar.style.backgroundColor = barColor;
                                hasChanges = true;
                            }
                        }

                        const statusEl = document.getElementById(`status-${item.lineId}`);
                        if (statusEl && statusEl.textContent.trim() !== status.label) {
                            statusEl.textContent = status.label;
                            statusEl.className = `text-[9px] font-bold px-2.5 py-1 rounded-full uppercase tracking-widest ${status.cls}`;
                            hasChanges = true;
                        }

                        if (hasChanges) {
                            const realEl = document.getElementById(`real-${item.lineId}`);
                            const trendIconContainer = document.getElementById(`trend-icon-${item.lineId}`);
                            
                            trendIconContainer.innerHTML = getTrendSvg(trendUp);
                            realEl.className = `text-4xl xl:text-[60px] font-bold font-mono leading-none ${trendUp ? 'text-emerald-600 dark:text-emerald-500' : 'text-red-600 dark:text-red-500'}`;
                            
                            card.classList.remove('flash-update');
                            void card.offsetWidth; 
                            card.classList.add('flash-update');
                        }
                    }

                    previousDataMap.set(item.lineId, item);
                });

                // --- OEE GLOBAL ---
                const globalOeeEl = document.getElementById('global-oee');
                if (flattenedData.length > 0) {
                    const avgOee = activeLinesCount > 0 ? (totalEficienciaAtivas / activeLinesCount) : 0;
                    globalOeeEl.textContent = `${numberFormatter.format(avgOee)}%`;
                    globalOeeEl.className = `text-6xl xl:text-[80px] font-extrabold mono leading-none mt-1 ${avgOee < 85 ? 'text-amber-500 dark:text-amber-400' : 'text-blue-600 dark:text-blue-400'}`;
                }

                // --- RANKING PERFORMANCE (SISTEMA DE PONTOS D-1) (<ul> e <li> implementados) ---
                const rankingLines = flattenedData.filter(item => FIXED_LINES.includes(item.lineId));
                const sortedRanking = rankingLines.sort((a, b) => (Number(b.pontos) || 0) - (Number(a.pontos) || 0));
                
                rankingContainer.innerHTML = sortedRanking.map((item, idx) => {
                    const pts = Number(item.pontos) || 0;
                    
                    let ptsColor = 'text-slate-500 dark:text-[#94a3b8]'; 
                    let ptsSign = '';
                    
                    if (pts > 0) {
                        ptsColor = 'text-emerald-600 dark:text-emerald-500';
                        ptsSign = '+';
                    } else if (pts < 0) {
                        ptsColor = 'text-red-600 dark:text-red-500';
                    }

                    return `
                        <li class="flex items-center justify-between p-3 lg:p-4 hover:bg-slate-50 dark:hover:bg-[#1c2128] rounded-xl transition-colors">
                            <div class="flex items-center gap-4">
                                <span class="w-6 h-6 xl:w-8 xl:h-8 flex items-center justify-center rounded-md font-bold text-xs xl:text-sm ${idx === 0 && pts > 0 ? 'bg-amber-100 text-amber-700 dark:bg-amber-500/20 dark:text-amber-500' : 'bg-slate-200 text-slate-600 dark:bg-slate-700 dark:text-slate-400'}">
                                    ${idx + 1}º
                                </span>
                                <span class="text-lg xl:text-xl font-semibold text-slate-800 dark:text-[#e2e8f0]">${item.lineId}</span>
                            </div>
                            <span class="text-xl xl:text-2xl font-bold font-mono ${ptsColor}">${ptsSign}${pts} pts</span>
                        </li>
                    `;
                }).join('');

                // --- SETORES (<ul> e <li> implementados) ---
                const sectorSummary = {
                    'automotivo': { total: 0, count: 0 },
                    'descartaveis': { total: 0, count: 0 },
                    'cirurgico': { total: 0, count: 0 }
                };

                flattenedData.forEach(item => {
                    const normKey = normalizeSector(item.setor);
                    if (sectorSummary[normKey]) {
                        sectorSummary[normKey].total += Number(item.eficiencia) || 0;
                        sectorSummary[normKey].count++; 
                    }
                });

                sectorContainer.innerHTML = FIXED_SECTORS.map(sec => {
                    const data = sectorSummary[sec.key];
                    const avg = data.count > 0 ? (data.total / data.count) : 0; 
                    const sectorColor = getBarColor(avg, '#3b82f6'); 
                    
                    return `
                        <li class="space-y-2">
                            <div class="flex justify-between items-end">
                                <span class="text-sm xl:text-base font-bold text-slate-800 dark:text-[#e2e8f0] uppercase tracking-tight">${sec.label}</span>
                                <span class="text-xl xl:text-2xl font-mono font-bold" style="color: ${sectorColor}">${numberFormatter.format(avg)}%</span>
                            </div>
                            <div class="h-4 xl:h-5 bg-slate-100 dark:bg-[#0d1117] rounded-full overflow-hidden border border-slate-200 dark:border-[#30363d]" role="progressbar" aria-valuenow="${Math.min(avg, 100)}" aria-valuemin="0" aria-valuemax="100">
                                <div class="h-full progress-transition" style="width: ${Math.min(avg, 100)}%; background-color: ${sectorColor}"></div>
                            </div>
                        </li>
                    `;
                }).join('');
            }

            window.addEventListener('DOMContentLoaded', () => {
                if (window.lucide) lucide.createIcons();

                setInterval(() => {
                    const now = new Date();
                    const timeEl = document.getElementById('current-time');
                    const dateEl = document.getElementById('current-date');
                    
                    if(timeEl) timeEl.innerText = now.toLocaleTimeString('pt-BR');
                    if(dateEl) dateEl.innerText = now.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' });
                }, 1000);

                try {
                    const firebaseConfig = { databaseURL: "https://paineltv-44596-default-rtdb.firebaseio.com/" };
                    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
                    const db = firebase.database();

                    db.ref('dashboard').on('value', (snapshot) => {
                        const rawData = snapshot.val() || {};
                        
                        Object.keys(currentState).forEach(k => {
                            currentState[k].eficiencia = 0;
                            currentState[k].meta = 0;
                            currentState[k].realizado = 0;
                            currentState[k].hc_prog = 0;
                            currentState[k].rejeito = 0;
                        });

                        Object.keys(rawData).forEach(setorName => {
                            const setorData = rawData[setorName];
                            Object.keys(setorData).forEach(lineId => {
                                if (!currentState[lineId]) {
                                    currentState[lineId] = { lineId: lineId };
                                }
                                currentState[lineId].setor = setorName;
                                currentState[lineId].eficiencia = setorData[lineId].eficiencia || 0;
                                currentState[lineId].meta = setorData[lineId].meta || 0;
                                currentState[lineId].realizado = setorData[lineId].realizado || 0;
                                currentState[lineId].hc_prog = setorData[lineId].hc_prog || 0;
                                currentState[lineId].rejeito = setorData[lineId].rejeito || 0;

                                if (setorData[lineId].pontos_ontem !== undefined) {
                                    currentState[lineId].pontos = setorData[lineId].pontos_ontem;
                                } else if (setorData[lineId].pontos !== undefined) {
                                    currentState[lineId].pontos = setorData[lineId].pontos;
                                } else {
                                    currentState[lineId].pontos = 0; 
                                }
                            });
                        });

                        flattenedData = Object.values(currentState);
                        renderDashboard();
                        
                        const alertEl = document.getElementById('alert-marquee');
                        if (alertEl) {
                            alertEl.innerText = `SISTEMA ONLINE: Consolidando dados mensais. Última sincronização: ${new Date().toLocaleTimeString('pt-BR')}`;
                        }
                    });
                } catch (e) {
                    console.error("Firebase Init Error:", e);
                    const alertEl = document.getElementById('alert-marquee');
                    if (alertEl) alertEl.innerText = "ERRO: Falha ao estabelecer conexão com o servidor industrial.";
                }
            });
        })();
    </script>
</body>
</html>
