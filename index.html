<!DOCTYPE html>
<html lang="pt-PT" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaaS Dashboard | Gestão à Vista</title>
    
    <!-- Tailwind CSS & Configuração -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        brand: {
                            bg: '#09090b', // zinc-950
                            surface: '#18181b', // zinc-900
                            border: '#27272a', // zinc-800
                            highlight: '#3b82f6', // blue-500
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- Fontes e Ícones -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Firebase SDK v8 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <style type="text/tailwindcss">
        @layer utilities {
            /* Design System: Glassmorphism Components */
            .glass-card {
                @apply bg-white/5 dark:bg-brand-surface/60 backdrop-blur-xl border border-black/5 dark:border-white/5 shadow-xl transition-all duration-300;
            }
            .glass-card:hover {
                @apply dark:border-white/10 dark:bg-brand-surface/80 shadow-2xl -translate-y-1;
            }
            
            /* Tipografia Premium para Grandes Números */
            .text-premium-kpi {
                @apply font-black tracking-tighter text-transparent bg-clip-text bg-gradient-to-br from-white to-zinc-400;
            }
            
            /* Transições Suaves */
            .smooth-bar {
                @apply transition-all duration-1000 ease-in-out;
            }
        }

        /* Microinteração de "Online" */
        .status-dot {
            animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
            70% { box-shadow: 0 0 0 6px rgba(34, 197, 94, 0); }
            100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }

        /* Microinteração de Flash ao Atualizar Dados */
        .data-update-flash {
            animation: soft-glow 0.8s ease-out;
        }
        @keyframes soft-glow {
            0%, 100% { box-shadow: inset 0 0 0 transparent; border-color: rgba(255,255,255,0.05); }
            50% { box-shadow: inset 0 0 20px rgba(59, 130, 246, 0.15); border-color: rgba(59, 130, 246, 0.4); }
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col p-4 md:p-6 bg-zinc-50 dark:bg-brand-bg text-zinc-900 dark:text-zinc-100 transition-colors duration-500">

    <!-- ================= HEADER ================= -->
    <header class="flex-none flex flex-col md:flex-row justify-between items-center gap-6 mb-6">
        <!-- Logo e Título -->
        <div class="flex items-center gap-4">
            <div class="w-14 h-14 bg-gradient-to-br from-indigo-500 to-blue-600 rounded-2xl flex items-center justify-center shadow-lg shadow-blue-500/20">
                <i data-lucide="layout-dashboard" class="text-white w-7 h-7" aria-hidden="true"></i>
            </div>
            <div>
                <h1 class="text-2xl font-black tracking-tight leading-none">Gestão Operacional</h1>
                <p class="text-zinc-500 dark:text-zinc-400 text-xs mt-1.5 uppercase tracking-widest font-semibold flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 status-dot"></span> Real-time Sync
                </p>
            </div>
        </div>

        <!-- Ferramentas Globais -->
        <div class="flex items-center gap-6">
            <!-- OEE Global -->
            <div class="hidden md:flex flex-col items-end pr-6 border-r border-zinc-200 dark:border-brand-border">
                <span class="text-[10px] uppercase tracking-widest text-zinc-500 dark:text-zinc-400 font-bold mb-1">OEE Global da Planta</span>
                <span id="global-oee" class="text-6xl xl:text-[80px] font-black tracking-tighter leading-none text-blue-500">--%</span>
            </div>

            <!-- Relógio e Ações -->
            <div class="flex items-center gap-3">
                <div class="glass-card px-5 py-3 rounded-2xl flex items-center gap-4">
                    <i data-lucide="clock" class="text-zinc-400 w-5 h-5" aria-hidden="true"></i>
                    <div class="flex flex-col items-end">
                        <span id="current-time" class="font-mono font-bold text-base leading-none text-zinc-800 dark:text-white">--:--:--</span>
                        <span id="current-date" class="text-[10px] text-zinc-500 dark:text-zinc-400 font-semibold leading-none mt-1.5 uppercase tracking-wider">--/--/----</span>
                    </div>
                </div>

                <div class="flex flex-col gap-2">
                    <button id="btn-theme" class="p-3 glass-card rounded-xl text-zinc-500 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-white" aria-label="Alternar Tema">
                        <i data-lucide="sun" class="w-4 h-4 hidden dark:block" aria-hidden="true"></i>
                        <i data-lucide="moon" class="w-4 h-4 block dark:hidden" aria-hidden="true"></i>
                    </button>
                    <button id="btn-fullscreen" class="p-3 glass-card rounded-xl text-zinc-500 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-white" aria-label="Ecrã Inteiro">
                        <i data-lucide="maximize" class="w-4 h-4" aria-hidden="true"></i>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- ================= MAIN CONTENT ================= -->
    <main class="flex-1 min-h-0 grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <!-- Cartões de Produção (8 colunas) -->
        <div id="lines-container" class="lg:col-span-8 grid grid-cols-1 md:grid-cols-2 grid-rows-2 gap-5 h-full">
            <!-- Os Skeletons agora usam o design system -->
            <div id="loading-skeletons" class="contents">
                <div class="glass-card rounded-3xl animate-pulse h-full p-6 flex flex-col justify-between">
                    <div class="h-10 w-32 bg-zinc-200 dark:bg-zinc-800 rounded-lg mb-4"></div>
                    <div class="h-16 w-full bg-zinc-200 dark:bg-zinc-800 rounded-xl mb-4"></div>
                    <div class="h-20 w-full bg-zinc-200 dark:bg-zinc-800 rounded-xl"></div>
                </div>
            </div>
        </div>

        <!-- Painéis Analíticos (4 colunas) -->
        <div class="lg:col-span-4 flex flex-col gap-5 h-full min-h-0">
            
            <!-- Setores -->
            <div class="flex-none glass-card rounded-3xl flex flex-col overflow-hidden relative">
                <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-blue-500 to-cyan-400 opacity-50"></div>
                <div class="px-6 py-5 border-b border-zinc-100 dark:border-white/5 flex items-center gap-3">
                    <i data-lucide="pie-chart" class="text-blue-500 w-5 h-5" aria-hidden="true"></i>
                    <h2 class="text-sm font-bold uppercase tracking-widest text-zinc-800 dark:text-zinc-100">Performance de Setor</h2>
                </div>
                <ul id="sectors-container" class="p-6 flex flex-col gap-6">
                    <li class="animate-pulse space-y-4"><div class="h-4 bg-zinc-800 rounded w-1/2"></div><div class="h-2 bg-zinc-800 rounded w-full"></div></li>
                </ul>
            </div>

            <!-- Ranking -->
            <div class="flex-1 min-h-0 glass-card rounded-3xl flex flex-col overflow-hidden relative">
                <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-amber-500 to-orange-400 opacity-50"></div>
                <div class="px-6 py-5 border-b border-zinc-100 dark:border-white/5 flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <i data-lucide="trophy" class="text-amber-500 w-5 h-5" aria-hidden="true"></i>
                        <h2 class="text-sm font-bold uppercase tracking-widest text-zinc-800 dark:text-zinc-100">Leaderboard</h2>
                    </div>
                    <span class="text-[9px] bg-zinc-200 dark:bg-zinc-800 text-zinc-600 dark:text-zinc-400 px-3 py-1.5 rounded-md uppercase font-bold tracking-widest">Pontos (D-1)</span>
                </div>
                <ul id="ranking-container" class="p-4 lg:p-5 flex-1 flex flex-col gap-3 overflow-y-auto">
                    <li class="flex-1 animate-pulse bg-zinc-800 rounded-xl"></li>
                </ul>
            </div>
        </div>
    </main>

    <!-- ================= FOOTER ================= -->
    <footer class="flex-none mt-5 flex items-center justify-between text-xs font-semibold tracking-widest uppercase">
        <div class="flex items-center gap-3 text-zinc-500 dark:text-zinc-400" id="footer-status">
            <i data-lucide="shield-check" class="w-4 h-4 text-emerald-500"></i>
            <span id="alert-marquee">Estabelecendo handshake seguro com Firebase...</span>
        </div>
        <div class="text-zinc-600 dark:text-zinc-500">
            SaaS Dashboard Core v2.0
        </div>
    </footer>

    <!-- ================= APPLICATION LOGIC ================= -->
    <script>
        (function() {
            /** * 1. CONFIGURAÇÕES GLOBAIS E ESTADO */
            const THEME = {
                lines: {
                    "LA": { color: "#10b981", bg: "bg-emerald-500/10", text: "text-emerald-500" }, 
                    "L1": { color: "#3b82f6", bg: "bg-blue-500/10", text: "text-blue-500" }, 
                    "L2": { color: "#f59e0b", bg: "bg-amber-500/10", text: "text-amber-500" },
                    "L3": { color: "#ef4444", bg: "bg-red-500/10", text: "text-red-500" }
                }
            };

            const FIXED_LINES = ['LA', 'L1', 'L2', 'L3'];
            const FIXED_SECTORS = [
                { key: 'automotivo', label: 'Automotivo' },
                { key: 'descartaveis', label: 'Descartáveis' },
                { key: 'cirurgico', label: 'Cirúrgico' }
            ];

            let state = {};
            FIXED_LINES.forEach(line => {
                state[line] = {
                    lineId: line, setor: "Aguardando", 
                    eficiencia: 0, meta: 0, realizado: 0, hc_prog: 0, rejeito: 0, pontos: 0
                };
            });

            let previousStateData = new Map();
            const fmtNum = new Intl.NumberFormat('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
            const fmtInt = new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 0 });

            /**
             * 2. COMPONENTES DE UI (Factory Functions)
             */
            const UIComponents = {
                TrendIcon: (isUp) => isUp 
                    ? `<svg class="w-6 h-6 xl:w-8 xl:h-8 text-emerald-400" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"></polyline><polyline points="16 7 22 7 22 13"></polyline></svg>` 
                    : `<svg class="w-6 h-6 xl:w-8 xl:h-8 text-red-400" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 17 13.5 8.5 8.5 13.5 2 7"></polyline><polyline points="16 17 22 17 22 11"></polyline></svg>`,
                
                StatusBadge: (ef) => {
                    if (ef <= 0) return `<span class="bg-red-500/10 text-red-500 ring-1 ring-red-500/20 px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-widest">Parada</span>`;
                    if (ef < 85) return `<span class="bg-amber-500/10 text-amber-500 ring-1 ring-amber-500/20 px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-widest">Atenção</span>`;
                    return `<span class="bg-emerald-500/10 text-emerald-500 ring-1 ring-emerald-500/20 px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-widest flex items-center gap-2"><span class="w-1.5 h-1.5 bg-emerald-500 rounded-full status-dot"></span> Produção</span>`;
                },

                LineCard: (item, idx, themeData, barColor, trendUp) => `
                    <div id="card-${item.lineId}" class="glass-card rounded-3xl flex flex-col h-full animate-fade-up" style="animation-delay: ${idx * 0.1}s">
                        
                        <div class="px-6 py-5 border-b border-black/5 dark:border-white/5 flex justify-between items-center flex-none">
                            <div class="flex items-center gap-4">
                                <div class="w-12 h-12 rounded-xl flex items-center justify-center font-black text-xl shadow-inner ${themeData.bg} ${themeData.text}">
                                    ${item.lineId}
                                </div>
                                <div>
                                    <h2 id="sector-title-${item.lineId}" class="text-sm font-bold uppercase tracking-widest text-zinc-900 dark:text-white">${item.setor}</h2>
                                    <p class="text-zinc-500 dark:text-zinc-400 text-[10px] mt-1 uppercase font-semibold tracking-widest">Linha Operacional</p>
                                </div>
                            </div>
                            <div id="status-${item.lineId}">${UIComponents.StatusBadge(item.eficiencia)}</div>
                        </div>
                        
                        <div class="px-6 py-4 flex-1 flex flex-col justify-center">
                            <div class="flex justify-between items-end mb-3">
                                <span class="text-xs xl:text-sm uppercase tracking-widest text-zinc-500 dark:text-zinc-400 font-bold">Eficiência OEE</span>
                                <span id="ef-val-${item.lineId}" class="text-5xl xl:text-6xl font-black font-mono tracking-tighter text-zinc-900 dark:text-white leading-none">${fmtNum.format(item.eficiencia)}%</span>
                            </div>
                            <div class="h-2 bg-zinc-200 dark:bg-zinc-800 rounded-full overflow-hidden shadow-inner">
                                <div id="ef-bar-${item.lineId}" class="h-full smooth-bar relative" style="width: ${Math.min(item.eficiencia, 100)}%; background-color: ${barColor}">
                                    <div class="absolute inset-0 bg-white/20 w-full h-full"></div>
                                </div>
                            </div>
                        </div>

                        <div class="grid grid-cols-4 divide-x divide-zinc-200 dark:divide-white/5 border-t border-zinc-200 dark:border-white/5 bg-zinc-100/50 dark:bg-black/20 flex-none rounded-b-3xl">
                            <div class="p-4 flex flex-col items-center justify-center text-center group cursor-default">
                                <span class="text-[9px] xl:text-[10px] uppercase tracking-widest text-zinc-500 font-bold mb-1.5 transition-colors group-hover:text-zinc-900 dark:group-hover:text-white">Meta</span>
                                <span id="meta-${item.lineId}" class="text-xl xl:text-3xl font-bold font-mono text-zinc-800 dark:text-zinc-200">${fmtInt.format(item.meta)}</span>
                            </div>
                            <div class="p-4 flex flex-col items-center justify-center text-center group cursor-default">
                                <span class="text-[9px] xl:text-[10px] uppercase tracking-widest text-zinc-500 font-bold mb-1.5 transition-colors group-hover:text-zinc-900 dark:group-hover:text-white">Real</span>
                                <span id="real-${item.lineId}" class="text-xl xl:text-3xl font-bold font-mono ${trendUp ? 'text-emerald-500' : 'text-red-500'} flex items-center gap-1">
                                    ${fmtInt.format(item.realizado)}
                                </span>
                            </div>
                            <div class="p-4 flex flex-col items-center justify-center text-center group cursor-default">
                                <span class="text-[9px] xl:text-[10px] uppercase tracking-widest text-zinc-500 font-bold mb-1.5 transition-colors group-hover:text-zinc-900 dark:group-hover:text-white">Op. HC</span>
                                <span id="hc-${item.lineId}" class="text-xl xl:text-3xl font-bold font-mono text-zinc-800 dark:text-zinc-200">${fmtInt.format(item.hc_prog)}</span>
                            </div>
                            <div class="p-4 flex flex-col items-center justify-center text-center group cursor-default">
                                <span class="text-[9px] xl:text-[10px] uppercase tracking-widest text-zinc-500 font-bold mb-1.5 transition-colors group-hover:text-zinc-900 dark:group-hover:text-white">Rejeito</span>
                                <span id="rej-${item.lineId}" class="text-xl xl:text-3xl font-bold font-mono text-zinc-800 dark:text-zinc-200">${fmtNum.format(item.rejeito)}%</span>
                            </div>
                        </div>
                    </div>
                `
            };

            /**
             * 3. CONTROLADOR DOM
             */
            const DOMController = {
                updateText: (id, newText, checkHasChanges = () => {}) => {
                    const el = document.getElementById(id);
                    if (el && el.textContent !== newText) {
                        el.textContent = newText;
                        checkHasChanges();
                    }
                },
                getBarColor: (ef, fallback) => ef < 50 ? '#ef4444' : ef < 85 ? '#f59e0b' : fallback,
                normalizeSector: (s) => {
                    if (!s) return 'outros';
                    const str = s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
                    if (str.includes('auto')) return 'automotivo';
                    if (str.includes('descart')) return 'descartaveis';
                    if (str.includes('cirurg')) return 'cirurgico';
                    return 'outros';
                }
            };

            function renderEngine() {
                const dataArray = Object.values(state);
                let totalEf = 0, countLines = 0;

                const linesContainer = document.getElementById('lines-container');
                if (!linesContainer) return;

                // --- LINHAS ---
                dataArray.forEach((item, index) => {
                    const ef = Number(item.eficiencia) || 0;
                    if (item.meta > 0 || item.hc_prog > 0 || ef > 0) { totalEf += ef; countLines++; }

                    const theme = THEME.lines[item.lineId] || { color: "#71717a", bg: "bg-zinc-800", text: "text-zinc-400" };
                    const barColor = DOMController.getBarColor(ef, theme.color);
                    const prevEf = previousStateData.get(item.lineId)?.eficiencia || ef;
                    const trendUp = ef >= prevEf;

                    const cardEl = document.getElementById(`card-${item.lineId}`);

                    if (!cardEl) {
                        linesContainer.insertAdjacentHTML('beforeend', UIComponents.LineCard(item, index, theme, barColor, trendUp));
                        const newCard = document.getElementById(`card-${item.lineId}`);
                        if (newCard && window.lucide) lucide.createIcons({ root: newCard });
                    } else {
                        let changed = false;
                        const markChange = () => { changed = true; };

                        DOMController.updateText(`sector-title-${item.lineId}`, item.setor, markChange);
                        DOMController.updateText(`ef-val-${item.lineId}`, `${fmtNum.format(ef)}%`, markChange);
                        DOMController.updateText(`meta-${item.lineId}`, fmtInt.format(item.meta), markChange);
                        DOMController.updateText(`real-${item.lineId}`, fmtInt.format(item.realizado), markChange);
                        DOMController.updateText(`hc-${item.lineId}`, fmtInt.format(item.hc_prog), markChange);
                        DOMController.updateText(`rej-${item.lineId}`, `${fmtNum.format(item.rejeito)}%`, markChange);

                        const bar = document.getElementById(`ef-bar-${item.lineId}`);
                        if (bar && bar.style.width !== `${Math.min(ef, 100)}%`) {
                            bar.style.width = `${Math.min(ef, 100)}%`; bar.style.backgroundColor = barColor; changed = true;
                        }

                        const statusEl = document.getElementById(`status-${item.lineId}`);
                        const newBadge = UIComponents.StatusBadge(ef);
                        if (statusEl && statusEl.innerHTML !== newBadge) {
                            statusEl.innerHTML = newBadge; changed = true;
                        }

                        if (changed) {
                            const realEl = document.getElementById(`real-${item.lineId}`);
                            if (realEl) realEl.className = `text-xl xl:text-3xl font-bold font-mono ${trendUp ? 'text-emerald-500' : 'text-red-500'} flex items-center gap-1`;
                            
                            cardEl.classList.remove('data-update-flash');
                            void cardEl.offsetWidth; // Trigger reflow for animation restart
                            cardEl.classList.add('data-update-flash');
                        }
                    }
                    previousStateData.set(item.lineId, { ...item });
                });

                // --- OEE ---
                const oeeEl = document.getElementById('global-oee');
                if (oeeEl) {
                    const avgOee = countLines > 0 ? (totalEf / countLines) : 0;
                    oeeEl.textContent = `${fmtNum.format(avgOee)}%`;
                    oeeEl.className = `text-6xl xl:text-[80px] font-black tracking-tighter leading-none mt-1 ${avgOee < 85 ? 'text-amber-500' : 'text-blue-500'}`;
                }

                // --- RANKING ---
                const rankingContainer = document.getElementById('ranking-container');
                if (rankingContainer) {
                    const sortedRanking = [...dataArray].sort((a, b) => (b.pontos || 0) - (a.pontos || 0));
                    rankingContainer.innerHTML = sortedRanking.map((item, idx) => {
                        const pts = item.pontos || 0;
                        const ptsColor = pts > 0 ? 'text-emerald-500' : pts < 0 ? 'text-red-500' : 'text-zinc-500 dark:text-zinc-400';
                        const bgClass = (idx === 0 && pts > 0) ? 'bg-gradient-to-br from-amber-400 to-orange-500 text-white shadow-lg' : 'bg-zinc-200 dark:bg-zinc-800/50 text-zinc-600 dark:text-zinc-400';
                        
                        return `
                            <li class="flex-1 flex items-center justify-between p-4 bg-zinc-100/50 hover:bg-zinc-100 dark:bg-white/5 dark:hover:bg-white/10 rounded-2xl transition-colors border border-transparent dark:border-white/5">
                                <div class="flex items-center gap-4">
                                    <div class="w-10 h-10 rounded-xl flex items-center justify-center font-black text-sm ${bgClass}">${idx + 1}º</div>
                                    <span class="text-xl font-bold text-zinc-800 dark:text-white uppercase tracking-wider">${item.lineId}</span>
                                </div>
                                <span class="text-2xl xl:text-3xl font-black font-mono ${ptsColor}">${pts > 0 ? '+' : ''}${pts} <span class="text-xs font-semibold uppercase tracking-widest opacity-60">pts</span></span>
                            </li>
                        `;
                    }).join('');
                }

                // --- SETORES ---
                const sectorContainer = document.getElementById('sectors-container');
                if (sectorContainer) {
                    const sectorSums = { 'automotivo': {t:0, c:0}, 'descartaveis': {t:0, c:0}, 'cirurgico': {t:0, c:0} };
                    dataArray.forEach(i => {
                        const k = DOMController.normalizeSector(i.setor);
                        if (sectorSums[k]) { sectorSums[k].t += (i.eficiencia||0); sectorSums[k].c++; }
                    });

                    sectorContainer.innerHTML = FIXED_SECTORS.map(sec => {
                        const avg = sectorSums[sec.key].c > 0 ? (sectorSums[sec.key].t / sectorSums[sec.key].c) : 0;
                        const sColor = DOMController.getBarColor(avg, '#3b82f6');
                        return `
                            <li class="space-y-3">
                                <div class="flex justify-between items-end">
                                    <span class="text-sm font-bold text-zinc-700 dark:text-zinc-200 uppercase tracking-widest">${sec.label}</span>
                                    <span class="text-xl font-black font-mono" style="color: ${sColor}">${fmtNum.format(avg)}%</span>
                                </div>
                                <div class="h-3 bg-zinc-200 dark:bg-zinc-800/50 rounded-full overflow-hidden shadow-inner">
                                    <div class="h-full smooth-bar relative" style="width: ${Math.min(avg, 100)}%; background-color: ${sColor}">
                                        <div class="absolute inset-0 bg-white/20 w-full h-full"></div>    
                                    </div>
                                </div>
                            </li>
                        `;
                    }).join('');
                }

                const loadingSkeletons = document.getElementById('loading-skeletons');
                if (loadingSkeletons) loadingSkeletons.remove();
            }

            /**
             * 4. INICIALIZAÇÃO & BINDINGS
             */
            window.addEventListener('DOMContentLoaded', () => {
                if (window.lucide) lucide.createIcons();

                // UI Interactivity
                const btnTheme = document.getElementById('btn-theme');
                if (btnTheme) {
                    btnTheme.addEventListener('click', () => document.documentElement.classList.toggle('dark'));
                }
                
                const btnFullscreen = document.getElementById('btn-fullscreen');
                if (btnFullscreen) {
                    btnFullscreen.addEventListener('click', () => {
                        if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(e => console.error(e));
                        else document.exitFullscreen();
                    });
                }

                // Clock Safely
                setInterval(() => {
                    const d = new Date();
                    const timeEl = document.getElementById('current-time');
                    const dateEl = document.getElementById('current-date');
                    if (timeEl) timeEl.textContent = d.toLocaleTimeString('pt-BR');
                    if (dateEl) dateEl.textContent = d.toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit', year:'numeric'});
                }, 1000);

                // Firebase Service
                try {
                    if (typeof firebase === 'undefined') {
                        throw new Error('SDK do Firebase não foi carregado corretamente.');
                    }

                    if (!firebase.apps.length) firebase.initializeApp({ databaseURL: "https://paineltv-44596-default-rtdb.firebaseio.com/" });
                    
                    firebase.database().ref('dashboard').on('value', (snapshot) => {
                        try {
                            const dbData = snapshot.val() || {};
                            
                            Object.keys(state).forEach(k => {
                                state[k].eficiencia = state[k].meta = state[k].realizado = state[k].hc_prog = state[k].rejeito = 0;
                            });

                            Object.keys(dbData).forEach(setor => {
                                const setorData = dbData[setor];
                                // Prevenção de erro caso o nó Firebase retorne uma string ou valor inválido em vez de objeto
                                if (setorData && typeof setorData === 'object') {
                                    Object.keys(setorData).forEach(line => {
                                        if (!state[line]) state[line] = { lineId: line };
                                        const payload = setorData[line];
                                        
                                        state[line] = {
                                            ...state[line], setor: setor,
                                            eficiencia: payload.eficiencia || 0,
                                            meta: payload.meta || 0,
                                            realizado: payload.realizado || 0,
                                            hc_prog: payload.hc_prog || 0,
                                            rejeito: payload.rejeito || 0,
                                            pontos: payload.pontos_ontem ?? payload.pontos ?? Math.max(-15, Math.min(15, (payload.eficiencia||0) > 0 ? Math.round(payload.eficiencia - 100) : 0))
                                        };
                                    });
                                }
                            });

                            renderEngine();

                            const alertMarquee = document.getElementById('alert-marquee');
                            if (alertMarquee) alertMarquee.textContent = `Dados da Fábrica Sincronizados com sucesso • ${new Date().toLocaleTimeString('pt-BR')}`;
                            
                            const footerIcon = document.getElementById('footer-status')?.querySelector('i');
                            if (footerIcon) {
                                footerIcon.classList.remove('text-amber-500', 'text-red-500');
                                footerIcon.classList.add('text-emerald-500');
                            }
                        } catch (processError) {
                            console.error("Erro interno ao renderizar os dados:", processError);
                        }
                    }, (error) => {
                        console.error("Erro no Firebase:", error);
                        const alertMarquee = document.getElementById('alert-marquee');
                        if (alertMarquee) alertMarquee.textContent = "Permissão Negada ou Erro de Leitura no Banco de Dados.";
                    });
                } catch (err) {
                    console.error("Erro na inicialização do Firebase:", err);
                    const alertMarquee = document.getElementById('alert-marquee');
                    if (alertMarquee) alertMarquee.textContent = "Falha de Conexão. Verifique o servidor Firebase.";
                    
                    const footerIcon = document.getElementById('footer-status')?.querySelector('i');
                    if (footerIcon) {
                        footerIcon.classList.remove('text-emerald-500', 'text-amber-500');
                        footerIcon.classList.add('text-red-500');
                    }
                }
            });
        })();
    </script>
</body>
</html>
